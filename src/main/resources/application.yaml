spring:
  application:
    name: research
  webflux:
    base-path: /research
  data:
    mongodb:
      uri: mongodb://localhost:27017/literature
  ai:
    ollama:
      init:
        pull-model-strategy: when_missing
        chat:
          additional-models:
            - gemma2
          options:
            temperature: 0.7
            model: gemma2
            stream: true
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          temperature: 0
springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
    enabled: true
  api-docs:
    enabled: true
    basePath: /api

logging:
  level:
    org.zalando.logbook: TRACE

logbook:
  format:
    style: http
    pretty-print: true